 <path d="M0 58 Q95.0 48 190.0 58 T380.0 58 T570.0 58 T760.0 58 T950.0 58 T1140.0 58 T1330.0 58 T1520.0 58 T1710.0 58 V150 H0 Z" fill="#B08D57" opacity=".16"><animateTransform attributeName="transform" type="translate" values="-380 0;0 0" dur="9s" repeatCount="indefinite"/></path>
